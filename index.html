            options: {interaction: {mode: 'index', intersect: false},
                      scales: {y: {...noBorder, ...zoomQuote(D.netto_quote), ticks: {callback: v => v + ' %'}}, x: noGridX},
                      plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => 'Netto-Quote: ' + pct(c.parsed.y)}}}}
        });

        new Chart(ctx('cPraemien'), {
            type: 'bar',
            data: {labels: D.labels, datasets: [{label: 'Ideenprämien', data: D.praemien, backgroundColor: C.brutto, borderRadius: 6}]},
            options: {scales: {y: {beginAtZero: true, ...noBorder, ticks: {callback: v => eur(v)}}, x: noGridX},
                      plugins: {legend: {display: false}, tooltip: {callbacks: {label: c => eur(c.parsed.y)}}}}
        });

        new Chart(ctx('cZeit'), {
            type: 'line',
            data: {labels: D.labels, datasets: [
                {label: 'Zeitkonto (h)', data: D.zeitkonto, yAxisID: 'y', ...line(C.zeit)},
                {label: 'Resturlaub lfd. Jahr (Tage)', data: D.urlaub, yAxisID: 'y1', ...line(C.urlaub)},
                {label: 'Resturlaub Vorjahr (Tage)', data: D.urlaub_vj, yAxisID: 'y1', ...line(C.vj, {borderDash: [6, 5]})},
                {label: 'Sonderurlaub T-Zug (Tage)', data: D.tzug, yAxisID: 'y1', ...line(C.tzug)}
            ]},
            options: {interaction: {mode: 'index', intersect: false}, scales: {
                y: {position: 'left', ...noBorder},
                y1: {position: 'right', ...noBorder, grid: {drawOnChartArea: false}},
                x: noGridX}}
        });

        const sheet = document.getElementById('sheet');
        let sheetChart = null;
        // Im Verwischen-Modus: Werte im Pop-up zunächst verwischt (false) oder sofort sichtbar (true)
        const POPUP_WERTE_STANDARD = false;
        const setzeAnzeige = an => {
            sheet.dataset.reveal = an ? '1' : '0';
            const knopf = document.getElementById('sheetReveal');
            knopf.setAttribute('aria-pressed', String(an));
            knopf.setAttribute('aria-label', an ? 'Werte verwischen' : 'Werte anzeigen');
            knopf.title = an ? 'Werte verwischen' : 'Werte anzeigen';
        };
        document.getElementById('sheetReveal').addEventListener('click', () => setzeAnzeige(sheet.dataset.reveal !== '1'));
        const DRILL = {
            netto:       {titel: 'Netto pro Monat',             typ: 'bar',  fmt: eur,     farbe: C.netto},
            brutto:      {titel: 'Brutto pro Monat',            typ: 'bar',  fmt: eur,     farbe: C.brutto},
            netto_quote: {titel: 'Netto-Quote pro Monat',       typ: 'line', fmt: pct,     farbe: C.netto,    zoom: true},
            ideen:       {titel: 'Ideenprämien pro Monat',      typ: 'bar',  fmt: eur,     farbe: C.brutto,   ideen: true},
            leistung:    {titel: 'Leistungsprozente pro Monat', typ: 'line', fmt: pct,     farbe: C.leistung, zoom: true, stepped: true},
            zeitkonto:   {titel: 'Zeitkonto pro Monat',         typ: 'line', fmt: stunden, farbe: C.zeit},
            ultimo:      {titel: 'Ultimo pro Monat',            typ: 'bar',  fmt: eur,     farbe: C.netto},
            rest:        {titel: 'Rest und Nachzahlung pro Monat', typ: 'bar', fmt: eur,  farbe: C.rest},
            gastro:      {titel: 'Gastronomie pro Monat',       typ: 'bar',  fmt: eur,     farbe: C.gastro},
            fahrrad:     {titel: 'Fahrrad, Kosten pro Monat',   typ: 'bar',  fmt: eur,     farbe: C.fahrrad},
            wochen:      {titel: 'Nachtschichtwochen pro Monat',     typ: 'bar',  fmt: zahl1,   farbe: C.nacht},
            sonntage:    {titel: 'Sonntage Nachtschicht pro Monat',  typ: 'bar',  fmt: zahl1,   farbe: C.nacht},
            naechte:     {titel: 'Nächte pro Monat',                 typ: 'bar',  fmt: zahl1,   farbe: C.nacht},
            mehr_so:     {titel: 'Mehrarbeit Sonntag pro Monat',     typ: 'bar',  fmt: stunden, farbe: C.sonntag}
        };

        function oeffneSheet(key, variante) {
            const cfg = DRILL[key];
            if (!cfg) return;
            variante = variante || 'normal';
            document.getElementById('sheetListe').hidden = true;
            const teil = key === 'netto' && variante === 'teil';                       // Ultimo und Rest übereinander
            const hatTeile = key === 'netto' && M.werte.ultimo.some(v => v != null);

            // Untermenü (nur beim Netto und nur, wenn Ultimo-Werte vorliegen)
            const tabs = document.getElementById('sheetTabs');
            tabs.replaceChildren();
            tabs.hidden = !hatTeile;
            if (hatTeile) {
                [['normal', 'Netto'], ['teil', 'Ultimo und Rest']].forEach(([v, text]) => {
                    const b = document.createElement('button');
                    b.type = 'button'; b.textContent = text; b.setAttribute('aria-pressed', String(v === variante));
                    b.addEventListener('click', () => oeffneSheet('netto', v));
                    tabs.append(b);
                });
            }

            let titel, sub, mitWert, stats = [], datasets, typ = cfg.typ, optionen;
            if (teil) {
                const u = M.werte.ultimo, r = M.werte.rest;
                mitWert = M.monate.map((m, i) => ({m: m, u: u[i], r: r[i]})).filter(x => x.u != null || x.r != null);
                const sU = mitWert.reduce((a, x) => a + (x.u || 0), 0), sR = mitWert.reduce((a, x) => a + (x.r || 0), 0);
                titel = 'Ultimo und Rest pro Monat ' + M.jahr;
                sub = 'Ultimo plus Rest und Nachzahlung ergeben das Netto.';
                if (mitWert.length) stats = [['Ultimo, Durchschnitt', eur(sU / mitWert.length)], ['Rest und Nachzahlung, Summe', eur(sR)],
                                             ['Rest-Anteil am Netto', (sU + sR) ? pct(sR / (sU + sR) * 100) : '–']];
                typ = 'bar';
                datasets = [{label: 'Ultimo', data: u, backgroundColor: C.netto, borderRadius: 5},
                            {label: 'Rest und Nachzahlung', data: r, backgroundColor: C.rest, borderRadius: 5}];
                optionen = {
                    interaction: {mode: 'index', intersect: false},
                    scales: {x: {stacked: true, ...noGridX}, y: {stacked: true, ...noBorder, ticks: {callback: v => eur(v)}}},
                    plugins: {legend: {display: true}, tooltip: {callbacks: {
                        label: c => c.dataset.label + ': ' + eur(c.parsed.y),
                        footer: items => 'Zusammen: ' + eur(items.reduce((a, it) => a + (it.parsed.y || 0), 0))
                    }}}
                };
            } else {
                const jahr = M.werte[key], vj = M.vj ? M.vj[key] : null;
                const hatVj = !!(vj && vj.some(v => v != null));
                titel = cfg.titel + ' ' + M.jahr;
                sub = hatVj ? 'Farbig: ' + M.jahr + '. Grau: ' + M.vj_jahr + ' zum Vergleich.' : 'Die einzelnen Monate von ' + M.jahr + '.';
                mitWert = jahr.map((v, i) => ({v: v, m: M.monate[i]})).filter(x => x.v != null);
                if (mitWert.length) {
                    const summe = mitWert.reduce((a, x) => a + x.v, 0);
                    const hoch = mitWert.reduce((a, x) => x.v > a.v ? x : a), tief = mitWert.reduce((a, x) => x.v < a.v ? x : a);
                    if (cfg.ideen) {
                        stats = [['Summe', cfg.fmt(summe)]];
                        if (hoch.v > 0) stats.push(['Bester Monat', hoch.m + ' (' + cfg.fmt(hoch.v) + ')']);
                        stats.push(['Monate mit Prämie', String(mitWert.filter(x => x.v > 0).length)]);
                    } else if (hoch.v === tief.v) {
                        stats = [['Durchschnitt', cfg.fmt(summe / mitWert.length)], ['Verlauf', 'In allen Monaten gleich']];
                    } else {
                        stats = [['Durchschnitt', cfg.fmt(summe / mitWert.length)], ['Höchster Monat', hoch.m + ' (' + cfg.fmt(hoch.v) + ')'],
                                 ['Niedrigster Monat', tief.m + ' (' + cfg.fmt(tief.v) + ')']];
                    }
                }
                if (key === 'fahrrad' && M.fahrrad_teile) {
                    const t = M.fahrrad_teile;
                    sub = 'Kosten = Bruttoumwandlung minus Zuschuss minus GWV plus GWV-Abzug vom Netto.' + (hatVj ? ' Grau: ' + M.vj_jahr + '.' : '');
                    stats = stats.concat([['Bruttoumwandlung im Jahr', eur(t.umwandlung)], ['Zuschuss im Jahr', eur(t.zuschuss)],
                                          ['GWV im Jahr (brutto / Netto-Abzug)', eur(t.gwv) + ' / ' + eur(t.gwv_netto)]]);
                }
                const reihe = (label, werte, istVj) => cfg.typ === 'bar'
                    ? {label: label, data: werte, backgroundColor: istVj ? 'rgba(135,148,165,.5)' : cfg.farbe, borderRadius: 6}
                    : {label: label, data: werte, spanGaps: true, stepped: !!cfg.stepped,
                       ...line(istVj ? 'rgba(135,148,165,.9)' : cfg.farbe, istVj ? {borderDash: [6, 5], borderWidth: 2} : {pointRadius: 3})};
                datasets = [];
                if (hatVj) datasets.push(reihe(String(M.vj_jahr), vj, true));
                datasets.push(reihe(String(M.jahr), jahr, false));
                const alle = jahr.concat(vj || []);
                optionen = {
                    interaction: {mode: 'index', intersect: false},
                    scales: {x: noGridX, y: {...noBorder, ...(cfg.zoom ? zoomQuote(alle) : {beginAtZero: cfg.typ === 'bar'}),
                                              ticks: {callback: v => cfg.fmt(v)}}},
                    plugins: {legend: {display: hatVj}, tooltip: {callbacks: {
                        label: c => c.dataset.label + ': ' + cfg.fmt(c.parsed.y),
                        footer: items => !cfg.ideen ? '' : items.map(it => {
                            const src = it.dataset.label === String(M.jahr) ? M.werte : M.vj;
                            const n = src ? src.anzahl[it.dataIndex] : null;
                            return n == null ? '' : it.dataset.label + ': ' + n + ' ' + (n === 1 ? 'Vorschlag' : 'Vorschläge');
                        }).filter(Boolean)
                    }}}
                };
            }

            document.getElementById('sheetTitel').textContent = titel;
            document.getElementById('sheetSub').textContent = sub;
            document.getElementById('sheetLeer').hidden = mitWert.length > 0;
            document.getElementById('sheetChartWrap').hidden = mitWert.length === 0;
            const box = document.getElementById('sheetStats');
            box.replaceChildren();
            stats.forEach(([k, v]) => {
                const d = document.createElement('div'); d.className = 'mini';
                const a = document.createElement('span'); a.className = 'k'; a.textContent = k;
                const b = document.createElement('span'); b.className = 'v'; b.textContent = v;
                d.append(a, b); box.append(d);
            });

            if (sheetChart) { sheetChart.destroy(); sheetChart = null; }
            if (!sheet.open) { setzeAnzeige(POPUP_WERTE_STANDARD); sheet.showModal(); }
            if (!mitWert.length) return;
            sheetChart = new Chart(document.getElementById('sheetCanvas'), {type: typ, data: {labels: M.monate, datasets: datasets}, options: optionen});
        }
        document.querySelectorAll('[data-drill]').forEach(el => el.addEventListener('click', () => oeffneSheet(el.dataset.drill)));
        document.getElementById('sheetClose').addEventListener('click', () => sheet.close());
        sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });   // Tippen auf den Hintergrund
        sheet.addEventListener('close', () => { if (sheetChart) { sheetChart.destroy(); sheetChart = null; } });

        // ---- Mehrarbeit: Monatsdetail (Aufteilung der Zeitzuschläge) und Diagramm ----
        function oeffneMonat(i) {
            const mo = S.monate[i];
            if (!mo || (!mo.zeilen.length && !mo.ruf)) return;
            if (sheetChart) { sheetChart.destroy(); sheetChart = null; }
            document.getElementById('sheetTabs').hidden = true;
            document.getElementById('sheetChartWrap').hidden = true;
            document.getElementById('sheetLeer').hidden = true;
            document.getElementById('sheetTitel').textContent = S.monatsnamen[i] + ' ' + S.jahr;
            document.getElementById('sheetSub').textContent = 'Aufteilung der Zeitzuschläge laut Abrechnung.';
            const box = document.getElementById('sheetStats');

/* ---------- PDF lesen (pdf.js liefert Textstücke mit Position; wir machen daraus Wörter) ---------- */
