<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ECF1EF">
    <title>Entgelt (Offline-App)</title>

    <!-- Darstellung (hell/dunkel) vor dem ersten Rendern setzen, damit nichts aufblitzt -->
    <script>
        (function () {
            var t = null;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.dataset.theme = t;
            var b = '0'; try { b = localStorage.getItem('blur') === '1' ? '1' : '0'; } catch (e) {}
            document.documentElement.dataset.blur = b;
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

    <style>
        :root {
            --pad: 16px;
            --font-display: "Bricolage Grotesque", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
            --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

            color-scheme: light;
            --bg: #ECF1EF;
            --plate: #FFFFFF;
            --line: rgba(16, 31, 51, .10);
            --ink: #101F33;
            --muted: #566579;
            --faint: #8794A5;
            --netto: #14A38B;
            --abzug: #D6336C;
            --brutto: #4A5CF0;
            --sonst: #E3A008;
            --pos: #0B7A68;  --pos-bg: rgba(20, 163, 139, .14);
            --neg: #B4234F;  --neg-bg: rgba(214, 51, 108, .11);
            --amber: #8A5A00; --amber-bg: rgba(227, 160, 8, .17);
            --glass: rgba(236, 241, 239, .78);
            --tip: #101F33;
            --dock-shadow: 0 14px 34px -14px rgba(16, 31, 51, .45);
        }
        [data-theme="dark"] {
            color-scheme: dark;
            --bg: #0A1322;
            --plate: #111D33;
            --line: rgba(232, 238, 247, .11);
            --ink: #E8EEF7;
            --muted: #9AA9BD;
            --faint: #6E7D92;
            --pos: #4DD6BE;  --pos-bg: rgba(77, 214, 190, .14);
            --neg: #FF7AA2;  --neg-bg: rgba(255, 122, 162, .14);
            --amber: #F2C14E; --amber-bg: rgba(242, 193, 78, .15);
            --glass: rgba(10, 19, 34, .78);
            --tip: #1C2B47;
            --dock-shadow: 0 14px 34px -14px rgba(0, 0, 0, .8);
        }
        @media (min-width: 760px) { :root { --pad: 28px; } }

        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.45; }
        a { color: inherit; }
        :focus-visible { outline: 2px solid var(--brutto); outline-offset: 2px; }
        .faint { color: var(--faint); }

        .wrap { max-width: 1180px; margin: 0 auto; padding: 22px var(--pad) 140px; }

        /* ---------- Obere Leiste (Glas) ---------- */
        .top { position: sticky; top: 0; z-index: 100; background: var(--glass);
               -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
               border-bottom: 1px solid var(--line); }
        .top-in { max-width: 1180px; margin: 0 auto; padding: 10px var(--pad) 8px; }
        .top-row { display: flex; align-items: center; justify-content: space-between; }
        .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -.01em; }
        .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink);
                    display: grid; place-items: center; cursor: pointer; }
        .icon-btn:active { transform: scale(.94); }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip { flex: 0 0 auto; padding: 7px 15px; border-radius: 999px; border: 1px solid var(--line); background: transparent;
                color: var(--ink); font: inherit; font-size: .92rem; text-decoration: none; cursor: pointer;
                transition: background .15s, color .15s; }
        .chip.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

        /* ---------- Schwebende Navigation unten ---------- */
        .dock { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 200;
                display: flex; gap: 4px; padding: 6px; border-radius: 999px; background: var(--glass);
                -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
                border: 1px solid var(--line); box-shadow: var(--dock-shadow); }
        .dock a { display: flex; align-items: center; gap: 8px; padding: 11px 17px; border-radius: 999px; color: var(--muted);
                  text-decoration: none; font-weight: 600; font-size: .92rem; transition: background .2s, color .2s; }
        .dock a.on { background: var(--ink); color: var(--bg); }
        @media (max-width: 560px) { .dock a:not(.on) .lbl { display: none; } .dock a:not(.on) { padding: 11px 14px; } }
        .ico { position: relative; display: inline-flex; }
        .badge { position: absolute; top: -7px; right: -9px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 999px;
                 background: var(--abzug); color: #fff; font: 700 .68rem/17px var(--font-body); text-align: center; font-style: normal; }

        /* ---------- Typografie ---------- */
        .page-title { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.9rem, 6vw, 2.6rem); letter-spacing: -.025em; margin: 4px 0 2px; line-height: 1.1; }
        .lede { color: var(--muted); margin: 0 0 20px; }
        .sec-title { font-family: var(--font-display); font-weight: 650; font-size: 1.1rem; letter-spacing: -.01em; margin: 0; }
        .sec-sub { color: var(--muted); font-size: .86rem; margin: 3px 0 14px; }
        .section-gap { margin-top: 30px; }

        /* ---------- Lohnstreifen (Jahres-Hero) ---------- */
        .slip { background: var(--plate); border: 1px solid var(--line); border-radius: 28px; margin-bottom: 20px; }
        .slip-top { padding: 22px 22px 20px; }
        .slip-bottom { padding: 18px 22px 22px; }
        .slip-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .year { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: -.02em; margin: 0; }
        .pill { display: inline-flex; align-items: center; padding: 3px 11px; border-radius: 999px; font-size: .82rem; font-weight: 600;
                color: var(--muted); border: 1px solid var(--line); }
        .hero-label { color: var(--muted); font-size: .9rem; margin-top: 14px; }
        .hero-num { font-family: var(--font-display); font-weight: 700; font-size: clamp(2.6rem, 12vw, 4.6rem); letter-spacing: -.035em;
                    line-height: 1; margin: 6px 0 12px; font-variation-settings: "opsz" 96; }
        .cents { font-size: .5em; color: var(--muted); font-weight: 600; letter-spacing: 0; }
        .hero-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; color: var(--muted); font-size: .92rem; }
        .perf { position: relative; margin: 0 22px; border-top: 2px dashed var(--line); }
        .perf::before, .perf::after { content: ""; position: absolute; top: -13px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); }
        .perf::before { left: -35px; }
        .perf::after { right: -35px; }

        .split { display: flex; gap: 3px; height: 24px; margin: 12px 0 16px; }
        .split .seg { border-radius: 8px; min-width: 5px; }
        .seg.netto { background: var(--netto); }
        .seg.abzug { background: var(--abzug); }
        .seg.sonst { background: var(--sonst); }
        .seg.rest { background: repeating-linear-gradient(45deg, var(--line), var(--line) 4px, transparent 4px, transparent 8px); }
        .reveal { animation: reveal .95s .1s cubic-bezier(.2, .8, .2, 1) both; }
        @keyframes reveal { from { clip-path: inset(0 100% 0 0 round 10px); } to { clip-path: inset(0 0 0 0 round 10px); } }
        @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }

        .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px 18px; list-style: none; padding: 0; margin: 0; }
        .legend .k { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: .88rem; }
        .legend .k i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
        .legend .v { font-family: var(--font-display); font-weight: 650; font-size: 1.1rem; display: block; }
        .legend .p { color: var(--muted); font-size: .86rem; }

        /* ---------- Kennzahlen-Raster (Haarlinien statt Einzelkarten) ---------- */
        .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-radius: 22px; overflow: hidden;
                 background: var(--plate); border: 1px solid var(--line); }
        .stats.auto { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
        .stat { padding: 16px 18px; outline: 1px solid var(--line); outline-offset: -.5px; min-width: 0; }
        @media (min-width: 760px) { .stats:not(.auto) { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        .stat .k { color: var(--muted); font-size: .88rem; }
        .stat .v { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.2rem, 5.4vw, 1.55rem); letter-spacing: -.02em; margin: 3px 0 2px; overflow-wrap: anywhere; }
        .stat .s { color: var(--muted); font-size: .86rem; }

        .delta { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: .82rem; font-weight: 600; white-space: nowrap; }
        .delta.up { color: var(--pos); background: var(--pos-bg); }
        .delta.down { color: var(--neg); background: var(--neg-bg); }

        /* ---------- Flächen / Diagramme ---------- */
        .plate { background: var(--plate); border: 1px solid var(--line); border-radius: 24px; padding: 20px; min-width: 0; }
        .grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 16px; }
        @media (min-width: 900px) { .grid2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span2 { grid-column: 1 / -1; } }
        .canvas-wrap { position: relative; height: 300px; }
        .canvas-wrap.tall { height: 340px; }
        .hint { color: var(--muted); font-size: .86rem; margin: 10px 0 0; }
        .foot { color: var(--faint); font-size: .84rem; margin: 26px 0 0; }

        /* ---------- Tabellen ---------- */
        .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 20px; background: var(--plate); }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        th { font-weight: 600; font-size: .82rem; color: var(--muted); text-align: left; padding: 13px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
        td { padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
        tbody tr:last-child td { border-bottom: 0; }
        td.num, th.num { text-align: right; }
        th:first-child, td:first-child { position: sticky; left: 0; background: var(--plate); z-index: 1; font-weight: 600; }
        tbody tr:hover td:not(:first-child) { background: rgba(127, 127, 127, .07); }
        tr.fehlt td:not(:first-child) { color: var(--faint); }
        @media (max-width: 520px) { th, td { padding-left: 9px; padding-right: 9px; } }

        .st { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; }
        .st::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .st.ok { color: var(--pos); background: var(--pos-bg); }
        .st.null { color: var(--amber); background: var(--amber-bg); }
        .st.fehlt { color: var(--neg); background: var(--neg-bg); }
        .warnchip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 600; color: var(--amber); background: var(--amber-bg); }
        .pdf-link { display: inline-block; padding: 2px 9px; margin-right: 4px; border-radius: 999px; border: 1px solid var(--line);
                    font-size: .8rem; text-decoration: none; color: var(--ink); }
        .pdf-link:hover { background: var(--ink); color: var(--bg); }

        /* ---------- Entgeltgruppen-Zeitstrahl ---------- */
        .egstrip { display: flex; gap: 3px; height: 50px; margin: 6px 0 16px; }
        .egseg { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 650; font-size: .92rem;
                 text-shadow: 0 1px 2px rgba(0, 0, 0, .25); overflow: hidden; white-space: nowrap; min-width: 0; border-radius: 12px; }
        .track-label { color: var(--muted); font-size: .85rem; margin: 4px 0 6px; }
        .egstrip.slim { height: 38px; margin-bottom: 10px; }
        .egseg.leer { background: repeating-linear-gradient(45deg, var(--line), var(--line) 4px, transparent 4px, transparent 8px) !important;
                      color: var(--faint); text-shadow: none; }
        .axis { display: flex; justify-content: space-between; color: var(--faint); font-size: .8rem; margin: 2px 0 20px; }
        .steps { list-style: none; margin: 0; padding: 0; }
        .step { display: grid; grid-template-columns: 22px minmax(0, 1fr); column-gap: 14px; position: relative; padding-bottom: 22px; }
        .step:last-child { padding-bottom: 0; }
        .step::before { content: ""; position: absolute; left: 10px; top: 26px; bottom: -4px; width: 2px; background: var(--line); }
        .step:last-child::before { display: none; }
        .pin { width: 22px; height: 22px; border-radius: 50%; border: 6px solid var(--c); background: var(--plate); margin-top: 1px; }
        .step-title { font-family: var(--font-display); font-weight: 650; font-size: 1.05rem; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .step-meta { color: var(--muted); font-size: .88rem; margin-top: 3px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .chipline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chipline .delta { white-space: normal; max-width: 100%; text-wrap: balance; }
        .delta.flat { color: var(--muted); background: var(--line); }

        /* ---------- Vergleichs-Filter ---------- */
        .filter { margin: 4px 0 20px; display: grid; gap: 18px; }
        .filter .grp-title { font-weight: 600; font-size: .9rem; margin: 0 0 8px; }
        .togs { display: flex; flex-wrap: wrap; gap: 8px; }
        .tog { position: relative; }
        .tog input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
        .tog span { display: inline-block; padding: 7px 14px; border-radius: 999px; border: 1px solid var(--line); transition: background .15s, color .15s; }
        .tog input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }
        .tog input:focus-visible + span { outline: 2px solid var(--brutto); outline-offset: 2px; }
        .row-opts { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 22px; }
        .check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
        .check input { width: 18px; height: 18px; accent-color: var(--netto); }
        select { padding: 9px 14px; font: inherit; border-radius: 12px; border: 1px solid var(--line); background: var(--plate); color: var(--ink); }
        .btn { background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 11px 26px; font: inherit; font-weight: 650; cursor: pointer; justify-self: start; }
        .btn:active { transform: scale(.97); }
        .empty { color: var(--muted); }

        [hidden] { display: none !important; }

        /* ---------- Erhöhungs-Markierung an den Jahres-Chips ---------- */
        .raise { color: #12A150; font-size: .72em; margin-right: 6px; line-height: 1; }
        .chip.active .raise { color: #34D399; }
        [data-theme="dark"] .chip .raise { color: #34D399; }
        [data-theme="dark"] .chip.active .raise { color: #0B8A4A; }

        /* ---------- Prüfen ---------- */
        .issues { display: grid; gap: 12px; margin-top: 16px; }
        .issue { padding: 16px 18px; border-radius: 20px; }
        .issue-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .issue-title { font-family: var(--font-display); font-weight: 650; font-size: 1.1rem; margin: 0; }
        .issue-row + .issue-row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
        .issue-hint { color: var(--muted); font-size: .9rem; margin: 6px 0 0; }
        .note { margin-top: 16px; color: var(--muted); }
        .ok-state { display: flex; align-items: center; gap: 16px; }
        .ok-state svg { flex: 0 0 auto; color: var(--netto); }
        .ok-state h2 { margin: 0 0 2px; }
        .fold { margin-top: 16px; }
        .fold summary { cursor: pointer; font-family: var(--font-display); font-weight: 650; font-size: 1.05rem; }
        .fold summary .faint { font-family: var(--font-body); font-weight: 400; font-size: .88rem; margin-left: 8px; }
        .fold-row { padding: 12px 0; border-top: 1px solid var(--line); }
        .fold-row:first-of-type { margin-top: 12px; }
        .fold-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .fold-months { color: var(--muted); font-size: .86rem; margin-top: 6px; }
        .btn-quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 7px 15px;
                     font: inherit; font-size: .88rem; font-weight: 600; cursor: pointer; }
        .btn-quiet:hover { border-color: var(--ink); }
        .issue-actions { margin-top: 12px; }
        .done-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
        .done-form input { flex: 1 1 220px; min-width: 0; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line);
                           background: var(--plate); color: var(--ink); font: inherit; }
        .btn.small { padding: 9px 20px; }
        /* ---------- Antippbare Kacheln und Diagramm-Pop-up ---------- */
        .stat > span { display: block; }
        .stat > span.pill { display: inline-flex; align-self: flex-start; margin-top: 8px; }
        .stat .delta { white-space: normal; }
        .stat .pill { white-space: normal; line-height: 1.3; border-radius: 14px; padding: 4px 11px; }
        .stat-btn > .k { padding-right: 40px; }
        .stat .k { hyphens: auto; overflow-wrap: break-word; }
        .stat-btn { position: relative; display: flex; flex-direction: column; justify-content: flex-start; width: 100%; text-align: left; font: inherit; color: inherit;
                    background: transparent; border: 0; cursor: pointer; transition: background .15s; }
        .stat-btn:hover { background: rgba(127, 127, 127, .06); }
        .stat-btn:active { background: rgba(127, 127, 127, .12); }
        .peek { color: var(--faint); flex: 0 0 auto; }
        .stat-btn .peek { position: absolute; top: 16px; right: 16px; }
        .hero-btn { display: inline-flex; align-items: center; gap: 14px; background: none; border: 0; padding: 0; color: inherit; text-align: left; cursor: pointer; }
        .hero-btn .peek { margin-top: .5em; }
        .hero-btn:hover .peek { color: var(--ink); }

        .sheet { border: 0; padding: 0; background: var(--plate); color: var(--ink); width: 100%; max-width: 100%; max-height: 90vh;
                 margin: auto 0 0; border-radius: 28px 28px 0 0; overflow: auto; box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, .5); }
        .sheet::backdrop { background: rgba(8, 16, 30, .55); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
        @media (min-width: 760px) { .sheet { width: min(680px, calc(100% - 40px)); margin: auto; border-radius: 28px; } }
        .sheet[open] { animation: sheet-in .28s cubic-bezier(.2, .8, .2, 1); }
        @keyframes sheet-in { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .sheet[open] { animation: none; } }
        body:has(dialog[open]) { overflow: hidden; }
        .sheet-in { padding: 10px 20px 24px; }
        .sheet-grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
        .sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
        .sheet-chart { position: relative; height: 280px; }
        .minis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 16px; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
        .minis:empty { display: none; }
        .mini { padding: 12px 14px; outline: 1px solid var(--line); outline-offset: -.5px; }
        .mini .k { display: block; color: var(--muted); font-size: .84rem; }
        .mini .v { display: block; font-family: var(--font-display); font-weight: 650; font-size: 1.05rem; margin-top: 2px; }

        .seg-tabs { display: flex; flex-wrap: nowrap; gap: 4px; padding: 4px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line);
                    margin: 4px 0 12px; width: 100%; max-width: 440px; }
        .seg-tabs[hidden] { display: none; }
        .seg-tabs button { flex: 1 1 0; min-width: 0; white-space: nowrap; text-align: center; border: 0; background: transparent; color: var(--muted);
                           font: inherit; font-weight: 600; font-size: .88rem; padding: 8px 8px; border-radius: 999px; cursor: pointer;
                           transition: background .15s, color .15s; }
        .seg-tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
        /* ---------- Schichtarbeit ---------- */
        .mstrip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin: 14px 0 4px; }
        @media (min-width: 760px) { .mstrip { grid-template-columns: repeat(12, minmax(0, 1fr)); } }
        .mcell { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 4px; border-radius: 14px;
                 border: 1px solid var(--line); background: rgba(79, 70, 229, var(--a, 0)); color: var(--ink); font: inherit; cursor: pointer; transition: transform .12s; }
        .mcell:active:not(:disabled) { transform: scale(.96); }
        .mcell:disabled { cursor: default; opacity: .55; }
        .mcell .mn { font-size: .78rem; color: var(--muted); }
        .mcell .mv { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; }
        .mcell.dunkel, .mcell.dunkel .mn { color: #fff; }
        .zlist { margin-top: 12px; }

function zahlDe(s) { return parseFloat(String(s).replace(",", ".")); }

function parseBetrag(text) {
  if (text === null || text === undefined) return null;
  let t = String(text).trim();
  const neg = t.startsWith("-") || t.endsWith("-");
  t = t.replace(/^-+|-+$/g, "").replace(/\./g, "").replace(",", ".");
  if (t === "" || !/^\d+(?:\.\d+)?$/.test(t)) return null;
  const v = Number(t);
  return neg ? -v : v;
}

function baueZeilen(woerter) {
  const w = woerter.slice().sort((a, b) => ((a[1] + a[3]) / 2 - (b[1] + b[3]) / 2) || (a[0] - b[0]));
  const zeilen = [];
  for (const wort of w) {
    const yc = (wort[1] + wort[3]) / 2;
    const tol = 0.4 * (wort[3] - wort[1]);
    if (zeilen.length && Math.abs(yc - zeilen[zeilen.length - 1].yc) <= tol) zeilen[zeilen.length - 1].words.push(wort);
    else zeilen.push({ yc, words: [wort] });
  }
  for (const z of zeilen) z.words.sort((a, b) => a[0] - b[0]);
  return zeilen;
}

function zeilentext(z) {
  let text = ""; const spans = [];
  for (const w of z.words) { const s = text.length; text += w[4]; spans.push({ s, e: text.length, w }); text += " "; }
  return { text, spans };
}

function betraegeIn(woerter) {
  const out = [];
  for (let i = 0; i < woerter.length; i++) {
    if (BETRAG_TOKEN.test(woerter[i][4])) {
      let wert = parseBetrag(woerter[i][4]);
      if (wert === null) continue;
      const nxt = i + 1 < woerter.length ? woerter[i + 1][4] : "";
      if (nxt === "-" && wert > 0) wert = -wert;
      out.push(wert);
    }
  }
  return out;
}

/* Suche mit RegExp ODER Funktion (für Muster mit Lookbehind, das ältere Safari-Versionen nicht kennen) */
function suche(text, pat) {
  if (typeof pat === "function") return pat(text);
  const r = new RegExp(pat.source, pat.flags.replace("g", ""));
  const m = r.exec(text);
  return m ? { index: m.index, end: m.index + m[0].length } : null;
}

function wertRechtsVonLabel(zeilen, muster, modus) {
  modus = modus || "letzter";
  for (const z of zeilen) {
    const { text, spans } = zeilentext(z);
    const m = suche(text, muster);
    if (!m) continue;
    const rechts = spans.filter(sp => sp.s >= m.end).map(sp => sp.w);
    const b = betraegeIn(rechts);
    if (b.length) return modus === "letzter" ? b[b.length - 1] : b[0];
  }
  return null;
}

/* ---------- Urlaub ---------- */
const URLAUB_LFD = /(?:rest-?\s*)?urlaub\s*:?\s*lfd/;
const URLAUB_FREIST = /(?:rest-?\s*)?urlaub\s*\/\s*freist/;
const URLAUB_VJ = [/(?:rest-?\s*)?urlaub\s*:?\s*(?:vorjahr|vj)(?![a-z])/, /(?:^|[^a-z])vj\s*-?\s*(?:rest-?\s*)?urlaub/, /vorjahres\s*-?\s*(?:rest-?\s*)?urlaub/];
const URLAUB_FREI = /rest-?\s*frei/;
const ZAHLENPAAR = /(\d+(?:,\d+)?)\s*\/\s*(\d+(?:,\d+)?)/;
const EINZELZAHL = /(\d+(?:,\d+)?)/;

function extrahiereUrlaub(zeilen) {
  const res = { lfd: null, vj: null, tzug: null };
  for (const z of zeilen) {
    const text = zeilentext(z).text; const low = text.toLowerCase();
    let m = suche(low, URLAUB_LFD);
    if (m && res.lfd === null) {
      const p = ZAHLENPAAR.exec(text.slice(m.end));
      if (p) { res.lfd = zahlDe(p[1]); res.vj = zahlDe(p[2]); }
      continue;
    }
    m = suche(low, URLAUB_FREIST);
    if (m && res.lfd === null) {
      const p = ZAHLENPAAR.exec(text.slice(m.end));
      if (p) { res.lfd = zahlDe(p[1]); res.tzug = zahlDe(p[2]); }
      continue;
    }
    if (res.vj === null) {
      let mv = null;
      for (const rx of URLAUB_VJ) { const mm = suche(low, rx); if (mm) { mv = mm; break; } }
      if (mv) {
        const e = EINZELZAHL.exec(text.slice(mv.end));
        if (e) res.vj = zahlDe(e[1]);
        continue;
      }
    }
    m = suche(low, URLAUB_FREI);
    if (m && res.tzug === null) {
      const p = ZAHLENPAAR.exec(text.slice(m.end));
      if (p) res.tzug = zahlDe(p[1]);
    }
  }
  return res;
}

function extrahiereEntgeltgruppe(zeilen) {
  for (const z of zeilen) {
    const text = zeilentext(z).text;
    const m = /entgeltgruppe/i.exec(text);
    if (!m) continue;
    let rest = text.slice(m.index + m[0].length);
    rest = rest.split(/arbeitszeitkennzeichen|resturlaub|zeitkonto|sabbatical|gesamtbrutto|übersicht/i)[0];
    rest = rest.replace(/^[ :]+|[ :]+$/g, "");
    if (rest) return rest;
  }
  return null;
}

function extrahiereLeistung(zeilen) {
  const werte = [];
  for (const z of zeilen) {
    const text = zeilentext(z).text;
    const m = /leistungsentgelt/i.exec(text);
    if (!m) continue;
    const rest = text.slice(m.index + m[0].length);
    for (const p of rest.matchAll(/(\d+(?:,\d+)?)\s*%/g)) werte.push(zahlDe(p[1]));
  }
  return werte.length ? Math.max(...werte) : null;
}

/* ---------- Ultimo / Rest ---------- */
function ultimoMuster(text) {                 // 'ultimo' oder 'Überweisung zum' (nicht Teil von 'Restüberweisung zum')
  const m1 = /ultimo/i.exec(text);
  let m2 = null;
  const rx = /überweisung\s+zum/gi; let mm;
  while ((mm = rx.exec(text)) !== null) {
    const prev = mm.index > 0 ? text[mm.index - 1] : "";
    if (!(prev && /[a-zäöü\-]/i.test(prev))) { m2 = mm; break; }
  }
  const a = m1 ? { index: m1.index, end: m1.index + m1[0].length } : null;
  const b = m2 ? { index: m2.index, end: m2.index + m2[0].length } : null;
  if (a && b) return a.index <= b.index ? a : b;
  return a || b;
}
const REST_MUSTER = /rest[\s\-]*(?:über|ueber)[\s\-]*weisung|nachzahlung|rest[\s\-]*zahlung/i;

function extrahiereUeberweisungen(zeilen, netto) {
  let start = 0;
  for (let i = 0; i < zeilen.length; i++) {
    if (/gesetzl(?:iches|\.)?\s*netto/i.test(zeilentext(zeilen[i]).text)) { start = i; break; }
  }
  const bereich = zeilen.slice(start);
  let ultimo = wertRechtsVonLabel(bereich, ultimoMuster, "erster");
  if (ultimo === null) ultimo = wertRechtsVonLabel(zeilen, ultimoMuster, "erster");
  let rest = wertRechtsVonLabel(bereich, REST_MUSTER, "erster");
  if (rest === null && ultimo !== null && netto !== null) rest = runde(netto - ultimo, 2);
  return [ultimo, rest];
}

/* ---------- Sonstige Posten (Gastronomie, Fahrrad) ---------- */
const SONSTIGE_POSTEN = { "Gastronomie (€)": /gastronomie/i, "Fahrrad (€)": /fahrrad/i };
const SONSTIGE_ENDE = /^netto\b|überweisung\s+zum|ultimo|restzahlung|rest-?\s*überweisung|aufteilung\s+der\s+zeitzuschl/i;

function extrahierePosten(zeilen) {
  const summen = {}; for (const k of Object.keys(SONSTIGE_POSTEN)) summen[k] = null;
  let start = null;
  for (let i = 0; i < zeilen.length; i++) {
    if (/^\s*sonstige\s+be-?\s*und\s+abzüge/i.test(zeilentext(zeilen[i]).text)) { start = i; break; }
  }
  if (start === null) return summen;
  for (let i = start + 1; i < zeilen.length; i++) {
    const { text, spans } = zeilentext(zeilen[i]);
    if (SONSTIGE_ENDE.test(text)) break;
    for (const [spalte, rx] of Object.entries(SONSTIGE_POSTEN)) {
      const m = suche(text, rx);
      if (!m) continue;
      const b = betraegeIn(spans.filter(sp => sp.s >= m.end).map(sp => sp.w));
      if (b.length) summen[spalte] = runde((summen[spalte] || 0) - b[b.length - 1], 2);
    }
  }
  return summen;
}

function extrahiereFahrrad(zeilen) {
  let ende = zeilen.length;
  for (let i = 0; i < zeilen.length; i++) {
    if (/^\s*gesamtbrutto/i.test(zeilentext(zeilen[i]).text)) { ende = i; break; }
  }
  const muster = { umw: /fahrrad[\s\-]*bruttoumwandlung|bruttoumwandlung[\s\-]*fahrrad/i, zus: /fahrrad[\s\-]*zuschuss|zuschuss[\s\-]*fahrrad/i, gwv: /gwv[\s\-]*fahrrad|fahrrad[\s\-]*gwv/i };
  const summen = { umw: null, zus: null, gwv: null };
  for (const z of zeilen.slice(0, ende)) {
    const { text, spans } = zeilentext(z);
    for (const [key, rx] of Object.entries(muster)) {
      const m = suche(text, rx);
      if (!m) continue;
      const b = betraegeIn(spans.filter(sp => sp.s >= m.end).map(sp => sp.w));
      if (!b.length) continue;
      let v = b[b.length - 1];
      if (key === "umw") v = Math.abs(v); else if (v <= 0) continue;
      summen[key] = runde((summen[key] || 0) + v, 2);
    }
  }
  return [summen.umw, summen.zus, summen.gwv];
}

/* ---------- Zeitzuschläge, Rufbereitschaft ---------- */
function istSonntag(low) { return /sonn/.test(low) || /(?:^|[^a-zäöü])so\./.test(low); }
const SONNTAG_NACHT = /dns|88\s*%/;
const REFERENZ = /referenz\s+schicht/;
const RUF = /ruf[\s\-]*bereitschaft/i;

function extrahiereZuschlaege(zeilen) {
  let kopf = null;
  for (let i = 0; i < zeilen.length; i++) {
    const { text, spans } = zeilentext(zeilen[i]);
    const m = /aufteilung\s+der\s+zeitzuschl/i.exec(text);
    if (m) {
      const sp = spans.find(s => s.e > m.index);
      kopf = [i, sp.w[0]]; break;
    }
  }
  if (kopf === null) return [[], null, null, null];
  const [i0, x0] = kopf;
  const rows = []; let ohneZahl = 0;
  for (const z of zeilen.slice(i0 + 1)) {
    const woerter = z.words.filter(w => w[0] >= x0 - 8);
    if (!woerter.length) continue;
    const tokens = woerter.map(w => w[4]);
    const zahlPos = []; tokens.forEach((t, k) => { if (ZAHL_TOKEN.test(t)) zahlPos.push(k); });
    if (!zahlPos.length) {
      if (rows.length) break;
      ohneZahl += 1; if (ohneZahl > 4) break; continue;
    }
    const k = zahlPos[0];
    const bez = tokens.slice(0, k).join(" ").trim();
    if (!bez) { if (rows.length) break; continue; }
    const werte = [];
    for (const j of zahlPos) {
      let v = parseBetrag(tokens[j]);
      if (v !== null) { if (j + 1 < tokens.length && tokens[j + 1] === "-" && v > 0) v = -v; werte.push(v); }
    }
    rows.push({ b: bez, h: werte[0], w: werte.length > 1 ? werte[1] : null });
  }
  if (!rows.length) return [[], null, null, null];
  let schicht = null, nacht = 0, mehr = 0;
  for (const r of rows) {
    const low = r.b.toLowerCase();
    if (REFERENZ.test(low)) { if (schicht === null) schicht = r.h; }
    else if (istSonntag(low) && !RUF.test(low)) { if (SONNTAG_NACHT.test(low)) nacht += r.h; else mehr += r.h; }
  }
  return [rows, schicht, runde(nacht, 2), runde(mehr, 2)];
}

function extrahiereRuf(zeilen) {
  const out = [];
  for (const z of zeilen) {
    const { text, spans } = zeilentext(z);
    const m = RUF.exec(text);
    if (!m) continue;
    const ende = m.index + m[0].length;
    const zahlen = spans.filter(sp => sp.s >= ende && ZAHL_TOKEN.test(sp.w[4])).map(sp => parseBetrag(sp.w[4])).filter(v => v !== null);
    if (zahlen.length) out.push({ z: text.slice(m.index).trim().slice(0, 160), w: zahlen[0] });
  }
  return out;
}

/* ---------- Ideenprämien: 'Ideenprämie 1' und der nächste Betrag ---------- */
function extrahiereIdeen(zeilen) {
  const werte = [];
  let suchen = false;
  for (const z of zeilen) {
    const { text, spans } = zeilentext(z);
    const low = text.toLowerCase();
    const idx = low.indexOf("ideenprämie 1");
    let start = 0;
    if (idx >= 0) {
      suchen = true; start = idx + "ideenprämie 1".length;       // Betrag kann in derselben Zeile rechts vom Label stehen
    } else if (!suchen) continue;
    const kandidaten = spans.filter(sp => sp.s >= start && sp.w[4].includes(","));
    if (kandidaten.length) {
      const wert = parseFloat(kandidaten[kandidaten.length - 1].w[4].replace(/\./g, "").replace(",", "."));
      if (!isNaN(wert) && /^-?\d+(?:\.\d+)?$/.test(kandidaten[kandidaten.length - 1].w[4].replace(/\./g, "").replace(",", "."))) { werte.push(wert); suchen = false; }
    }
  }
  return werte;
}

function erkenneMonat(zeilenErsteSeite) {
  for (const z of zeilenErsteSeite) {
    const text = z.words.map(w => w[4]).join(" ");
    for (const [name, nr] of Object.entries(MONATSNAMEN)) {
      if (text.includes(name)) {
        const jahr = text.split(/\s+/).find(p => /^\d{4}$/.test(p));
        if (jahr) return `${nr}.${jahr}`;
        break;
      }
    }
  }
  return "";
}

const ABR_SUMME = ["Brutto (€)", "Netto (€)", "Gesetzl. Abzüge (€)", "Sonstige Abzüge (€)", "Ultimo (€)", "Rest (€)", "Gastronomie (€)", "Fahrrad (€)",
  "Fahrrad Umwandlung (€)", "Fahrrad Zuschuss (€)", "Fahrrad GWV (€)", "Sonntag Nacht (h)", "Mehrarbeit Sonntag (h)", "Rufbereitschaft"];

function extrahiereAbrechnung(seiten) {
  const zeilen = [];
  for (const s of seiten) zeilen.push(...baueZeilen(s));
  const warnungen = [];
  const brutto = wertRechtsVonLabel(zeilen, /gesamtbrutto/i);
  const netto = wertRechtsVonLabel(zeilen, /auszahlungsbetrag/i);
  const abzuege = wertRechtsVonLabel(zeilen, /gesetzliche\s+abzüge/i);
  const sonstige = wertRechtsVonLabel(zeilen, /sonstige\s+be-?\s*und\s+abzüge/i);
  if (brutto !== null && abzuege !== null && netto !== null && Math.abs(brutto + abzuege + (sonstige || 0) - netto) > 0.02)
    warnungen.push("Brutto minus Abzüge minus Sonstige ergibt nicht den Auszahlungsbetrag");
  const zeitkonto = wertRechtsVonLabel(zeilen, /zeitkonto/i, "erster");
  const wochenstd = wertRechtsVonLabel(zeilen, /arbeitszeitkennzeichen/i, "erster");
  const urlaub = extrahiereUrlaub(zeilen);
  const [ultimo, rest] = extrahiereUeberweisungen(zeilen, netto);
  const posten = extrahierePosten(zeilen);
  const [zz, schichtH, sonntagNachtH, mehrSonntagH] = extrahiereZuschlaege(zeilen);
  const [fUmw, fZus, fGwv] = extrahiereFahrrad(zeilen);
  const ruf = extrahiereRuf(zeilen);
  const erg = {
    "Brutto (€)": brutto, "Netto (€)": netto,
    "Gesetzl. Abzüge (€)": abzuege !== null ? runde(-abzuege, 2) : null,
    "Sonstige Abzüge (€)": sonstige !== null ? runde(-sonstige, 2) : null,
    "Ultimo (€)": ultimo, "Rest (€)": rest,
    "Gastronomie (€)": posten["Gastronomie (€)"], "Fahrrad (€)": posten["Fahrrad (€)"],
    "Fahrrad Umwandlung (€)": fUmw, "Fahrrad Zuschuss (€)": fZus, "Fahrrad GWV (€)": fGwv,
    "Schichtdauer (h)": schichtH, "Sonntag Nacht (h)": sonntagNachtH, "Mehrarbeit Sonntag (h)": mehrSonntagH,
    "Rufbereitschaft": ruf.length ? 1 : 0, "Rufbereitschaft (JSON)": ruf.length ? JSON.stringify(ruf) : null,
    "Zuschläge (JSON)": zz.length ? JSON.stringify(zz) : null,
    "Zeitkonto (h)": zeitkonto, "Resturlaub lfd. Jahr (Tage)": urlaub.lfd, "Resturlaub VJ (Tage)": urlaub.vj,
    "Sonderurlaub T-Zug (Tage)": urlaub.tzug, "Wochenstunden": wochenstd,
    "Leistung (%)": extrahiereLeistung(zeilen), "Entgeltgruppe": extrahiereEntgeltgruppe(zeilen),
  };
  return { erg, zeilen, warnungen };
}

/* Eine ganze PDF: Seiten (Wortlisten) -> Monat, Abrechnungswerte, Ideenprämien */
function verarbeitePdf(seiten) {
  if (!seiten.length) return { monat: "", abr: null, ideen: [], warnungen: ["Keine Seiten gefunden"] };
  const ersteZeilen = baueZeilen(seiten[0]);
  const monat = erkenneMonat(ersteZeilen);
  const { erg, zeilen, warnungen } = extrahiereAbrechnung(seiten);
  const ideen = extrahiereIdeen(zeilen);
  return { monat, abr: erg, ideen, warnungen };
}

/* ===== Datenmodell der Offline-App: Monatszeilen, Kennzahlen, Zeitreihen (Port von app.py) ===== */
const MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
const NAECHTE_PRO_WOCHE = 6, SONNTAG_SCHICHT_H = 7.5, SCHICHT_RUNDUNG = 0.4;

const nn = x => (x === null || x === undefined || Number.isNaN(x)) ? null : runde(x, 2);
const ssum = arr => { const v = arr.filter(x => x != null); return v.length ? runde(v.reduce((a, b) => a + b, 0), 2) : null; };
const mittel = arr => { const v = arr.filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
const pctChange = (neu, alt) => (neu == null || !alt) ? null : runde((neu - alt) / alt * 100, 1);
const quote = (teil, ganz) => (teil == null || !ganz) ? null : runde(teil / ganz * 100, 1);
const deZahl = (x, n) => { n = n === undefined ? 2 : n; return Number(x).toLocaleString("de-DE", { minimumFractionDigits: n, maximumFractionDigits: n }); };
const txtOrNull = x => { if (x === null || x === undefined) return null; const s = String(x).trim(); return s || null; };

function zuschlagArt(b) {
  const low = b.toLowerCase();
  if (/referenz\s+schicht/.test(low)) return "referenz";
  if (/ruf[\s\-]*bereitschaft/.test(low)) return "ruf";
  if (istSonntag(low)) return /dns|88\s*%/.test(low) ? "sonntag_nacht" : "sonntag_mehr";
  if (/nacht/.test(low)) return "nacht";
  return "sonst";
}
function zaehleSchichten(stunden, laenge) {
  if (stunden == null || Number.isNaN(stunden) || !laenge || laenge <= 0) return [null, null];
  const n = Math.floor(stunden / laenge + SCHICHT_RUNDUNG);
  const mehr = runde(stunden - n * laenge, 2);
  return [n, mehr > 0.05 ? mehr : 0];
}
function zeileInfo(z) {
  if (z.art === "nacht") return "wird nicht gezählt, nur Sonntage mit Nachtschicht zählen";
  if (z.art === "sonntag_mehr") return "Mehrarbeit ohne Nachtschicht, zählt nicht als Nachtschichtwoche";
  if (z.art === "sonntag_nacht") {
    const [n, zusatz] = zaehleSchichten(z.h, SONNTAG_SCHICHT_H);
    if (n === null) return null;
    return `${n} ${n === 1 ? "Sonntag" : "Sonntage"} Nachtschicht` + (zusatz ? `, davon ca. ${deZahl(zusatz)} h zusätzlich` : "");
  }
  return null;
}
function parseJson(t) { if (!t) return []; try { const d = JSON.parse(t); return Array.isArray(d) ? d : []; } catch (e) { return []; } }
function parseZuschlaege(t) {
  return parseJson(t).filter(z => z && typeof z === "object" && "b" in z && z.h != null)
    .map(z => ({ b: String(z.b), h: nn(z.h), w: z.w != null ? nn(z.w) : null, art: zuschlagArt(String(z.b)) }));
}

/* Eine Monatszeile aus den ausgelesenen Werten (e = {abr, ideen}) oder eine Lücke (e = null) */
function baueZeile(key, e) {
  const [mm, jj] = key.split(".");
  const r = { key, j: +jj, m: +mm, real: !!e, abr: e ? (e.abr || {}) : {} };
  const a = r.abr, g = k => (a[k] === undefined ? null : a[k]);
  const ideen = e ? (e.ideen || []) : [];
  r.summe = e ? ssum(ideen) || 0 : 0; r.anzahl = ideen.filter(v => v !== 0).length;
  r.status = !e ? "DATEI FEHLT" : (r.summe === 0 ? "KEIN BONUS" : "OK");
  r.brutto = g("Brutto (€)"); r.netto = g("Netto (€)"); r.abz = g("Gesetzl. Abzüge (€)"); r.sonst = g("Sonstige Abzüge (€)");
  r.quote = (r.brutto != null && r.brutto > 0 && r.netto != null) ? r.netto / r.brutto * 100 : null;
  r.ultimo = g("Ultimo (€)"); r.rest = g("Rest (€)"); r.gastro = g("Gastronomie (€)");
  r.umw = g("Fahrrad Umwandlung (€)"); r.zus = g("Fahrrad Zuschuss (€)"); r.gwv = g("Fahrrad GWV (€)"); r.gwvNetto = g("Fahrrad (€)");
  r.fahrrad = r.umw != null ? runde(r.umw - (r.zus || 0) - (r.gwv || 0) + (r.gwvNetto || 0), 2) : null;
  r.zeitkonto = g("Zeitkonto (h)"); r.urlaub = g("Resturlaub lfd. Jahr (Tage)"); r.urlaubVj = g("Resturlaub VJ (Tage)");
  r.tzug = g("Sonderurlaub T-Zug (Tage)"); r.leistung = g("Leistung (%)"); r.eg = txtOrNull(g("Entgeltgruppe"));
  r.zeilen = parseZuschlaege(g("Zuschläge (JSON)"));
  let nachtH, mehrH;

    netto_quote: f("quote"), ideen: dfa.map(r => r.status === "DATEI FEHLT" ? null : nn(r.summe)), leistung: f("leistung"),

const METRIKEN = {

function baueVergleich(rows, jahreAlle, args) {

  const basis = monateSel.length ? monateSel : Array.from({ length: 12 }, (_, i) => i + 1);
  const monate = !sel.length ? [] : gleich ? basis.filter(m => sel.every(j => vorhanden.has(j + "-" + m))) : basis.filter(m => sel.some(j => vorhanden.has(j + "-" + m)));

    const ideen = ssum(teil.map(r => r.status === "DATEI FEHLT" ? null : r.summe));
    const row = { jahr: j, monate: teil.filter(r => r.status !== "DATEI FEHLT").length, brutto: b, netto: n, abzuege: ab, sonstige: so, netto_quote: quote(n, b),
      ideen, anzahl: teil.reduce((s, r) => s + r.anzahl, 0), d_netto: vorher ? pctChange(n, vorher.netto) : null, d_ideen: vorher ? pctChange(ideen, vorher.ideen) : null };

}

const delta = (d, gutHoch, einheit, suffix) => d == null ? '<span class="faint">–</span>'
  : `<span class="delta ${((d >= 0) === gutHoch) ? "up" : "down"}">${d >= 0 ? "▲" : "▼"} ${esc(deZahl(Math.abs(d), 1))} ${einheit}${suffix || ""}</span>`;
const peek = () => '<svg class="peek" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 20V12M12 20V5M18 20v-6"/></svg>';
const wecker = g => `<svg class="wecker" width="${g || 14}" height="${g || 14}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 9.5V13l2.4 1.6M5 4.5L3 6.5M19 4.5l2 2"/></svg>`;
const plural = (n, e, m) => n === 1 ? e : m;
const seitBlock = (info, zusatz) => info
  ? `<span class="s">Unverändert seit ${info.mindestens ? "mindestens " : ""}${esc(info.seit)}</span><span class="pill">${esc(info.dauer)}</span>${zusatz ? `<span class="s" style="margin-top:6px">${esc(zusatz)}</span>` : ""}`
  : '<span class="s">Noch nicht eingelesen</span>';
const kachel = (drill, k, v, s, extra) => `<button type="button" class="stat stat-btn" data-drill="${drill}" aria-haspopup="dialog"><span class="k">${k}</span><span class="v">${v}</span>${s || ""}${extra || ""}${peek()}</button>`;

function htmlJahr(c) {
  const { kpi, stand, schicht, schichtJahre } = c; const b = kpi.brutto;
  const erJahr = c.erhoehungen[kpi.jahr];
  let h = "";
  /* --- Kopf: Netto ausgezahlt und Aufteilung --- */
  h += `<section class="slip"><div class="slip-top"><div class="slip-head"><h1 class="year">${kpi.jahr}</h1><span class="pill">${kpi.monate} ${plural(kpi.monate, "Monat", "Monate")} mit Daten</span></div>
    <div class="hero-label">Netto ausgezahlt</div>
    <button type="button" class="hero-num hero-btn" data-drill="netto" aria-haspopup="dialog" aria-label="Netto pro Monat als Diagramm öffnen"><span>${big(kpi.netto)}</span>${peek()}</button>
    <div class="hero-sub"><span>Ø ${fEur(kpi.netto_schnitt)} pro Monat</span>${kpi.delta_netto != null ? delta(kpi.delta_netto, true, "%", " ggü. Vorjahr") : ""}</div>
    ${erJahr ? `<div class="chipline" style="margin-top:12px">${erJahr.map(e => `<span class="delta up">▲ ${esc(e.monat)}: ${esc(e.text)}</span>`).join("")}</div>` : ""}
    </div><div class="perf"></div><div class="slip-bottom">`;
  if (b) {
    const pn = (kpi.netto || 0) / b * 100, pa = (kpi.abzuege || 0) / b * 100, ps = (kpi.sonstige || 0) / b * 100, pr = Math.max(0, 100 - pn - pa - ps);
    const p1 = x => esc(deZahl(x, 1));
    h += `<div class="hero-label" style="margin-top:0">Wohin das Brutto von ${fEur(b)} fließt</div>
      <div class="split reveal" role="img" aria-label="Aufteilung des Brutto in Netto, gesetzliche Abzüge und sonstige Abzüge"><span class="seg netto" style="flex: ${pn} 1 0"></span>${pa > 0 ? `<span class="seg abzug" style="flex: ${pa} 1 0"></span>` : ""}${ps > 0 ? `<span class="seg sonst" style="flex: ${ps} 1 0"></span>` : ""}${pr > 0.5 ? `<span class="seg rest" style="flex: ${pr} 1 0"></span>` : ""}</div>
      <ul class="legend"><li><span class="k"><i style="background:var(--netto)"></i>Netto</span><span class="v">${fEur(kpi.netto)}</span><span class="p">${p1(pn)} % vom Brutto</span></li>
      <li><span class="k"><i style="background:var(--abzug)"></i>Gesetzl. Abzüge</span><span class="v">${fEur(kpi.abzuege)}</span><span class="p">${p1(pa)} % vom Brutto</span></li>
      ${ps > 0 ? `<li><span class="k"><i style="background:var(--sonst)"></i>Sonstige Abzüge</span><span class="v">${fEur(kpi.sonstige)}</span><span class="p">${p1(ps)} % vom Brutto</span></li>` : ""}
      ${pr > 0.5 ? `<li><span class="k"><i style="background:var(--faint)"></i>Ohne Abzugsdaten</span><span class="v">–</span><span class="p">${p1(pr)} % noch nicht eingelesen</span></li>` : ""}</ul>`;
  } else h += `<p class="empty" style="margin:0">Für ${kpi.jahr} liegen noch keine Brutto-Werte vor.</p>`;
  h += `</div></section>`;
  /* --- Gruppe Entgelt --- */
  h += `<section class="group"><h2 class="group-title">Entgelt</h2><div class="stats">`;
  h += kachel("brutto", "Brutto pro Monat", b && kpi.monate ? big(b / kpi.monate) : "–", `<span class="s">Durchschnitt über ${kpi.monate} ${plural(kpi.monate, "Monat", "Monate")}</span>`);
  h += kachel("netto_quote", "Netto-Quote", fPct(kpi.netto_quote), '<span class="s">Netto im Verhältnis zum Brutto</span>');
  h += kachel("ideen", "Ideenprämien", big(kpi.praemien), `<span class="s">${kpi.praemien_anzahl} ${plural(kpi.praemien_anzahl, "Vorschlag", "Vorschläge")}, ${fPct(kpi.praemien_anteil)} vom Brutto</span>`);
  if (kpi.ultimo_schnitt != null) {
    h += kachel("ultimo", "Ultimo pro Monat", big(kpi.ultimo_schnitt), '<span class="s">Überweisung zum Monatsende</span>', kpi.ultimo_delta != null ? `<span class="s" style="margin-top:6px">${delta(kpi.ultimo_delta, true, "%", " ggü. Vorjahr")}</span>` : "");
    h += kachel("rest", "Rest und Nachzahlung", big(kpi.rest_summe), `<span class="s">Summe im Jahr, Ø ${fEur(kpi.rest_schnitt)} pro Monat</span>`);
  }
  h += `</div></section>`;
  /* --- Gruppe Stufe und Zeitkonto --- */
  h += `<section class="group"><h2 class="group-title">Stufe und Zeitkonto</h2><div class="stats">
    <div class="stat"><span class="k">Entgeltgruppe</span><span class="v">${esc(stand.eg ? stand.eg.wert : (kpi.eg || "–"))}</span>${seitBlock(stand.eg, kpi.eg_wechsel ? "Wechsel im Jahr, zuvor " + kpi.eg_erste : "")}</div>
    <button type="button" class="stat stat-btn" data-drill="leistung" aria-haspopup="dialog"><span class="k">Leistungsprozente</span><span class="v">${fPct(stand.lp ? stand.lp.wert : kpi.leistung)}</span>${seitBlock(stand.lp, kpi.leistung_wechsel ? "Im Jahr geändert" : "")}${peek()}</button>
    <button type="button" class="stat stat-btn" data-drill="zeitkonto" aria-haspopup="dialog"><span class="k">Zeitkonto am Jahresende</span><span class="v">${kpi.zk_ende != null ? sens(esc(deZahl(kpi.zk_ende)) + " h") : "–"}</span>
      ${kpi.zk_delta != null ? `<span class="s">${kpi.zk_vj ? "Seit Jahresbeginn" : "Seit dem ersten Monat mit Daten"}</span><span class="pill" style="margin-top:6px">${kpi.zk_delta >= 0 ? "+" : "–"}${esc(deZahl(Math.abs(kpi.zk_delta)))} h</span>` : '<span class="s">Keine Veränderung berechenbar</span>'}${peek()}</button></div></section>`;
  /* --- Gruppe Mehrarbeit --- */
  if (schicht.hat) {
    const mm = schicht.monate_mit_daten, mon = plural(mm, "Monat", "Monaten");
    h += `<section class="group"><h2 class="group-title">Mehrarbeit</h2><div class="plate">
      <p class="sec-sub">Nachtschichtwochen zählen nur Sonntage mit Nachtschicht (Mehrarbeit So. 88 % DNS). Jeder dieser Sonntage steht für eine Woche mit ${schicht.naechte_pro_woche} Nächten (Sonntag bis Samstag), eine Sonntagsschicht rechnet mit ${fSch(schicht.sonntag_schicht_h)} Stunden. Mehrarbeit an Sonntagen ohne Nachtschicht (50 %, 80 %) steht getrennt daneben.</p>
      <div class="stats auto">
        ${kachel("mehr_so", "Mehrarbeit Sonntag", `${fZahl(schicht.mehr_h)}<span class="cents"> Std.</span>`, `<span class="s">Ohne Nachtschicht, in ${schicht.mehr_monate} von ${mm} ${mon}</span>`)}
        ${kachel("sonntage", "Sonntage Nachtschicht", `${schicht.sonntage}<span class="cents"> Sonntage</span>`, `<span class="s">${fZahl(schicht.sonntag_h)} Std.${schicht.zusatz_h ? `, davon ca. ${fZahl(schicht.zusatz_h)} h zusätzlich` : ""}</span>`)}
        ${kachel("wochen", "Nachtschicht&shy;wochen", `${schicht.wochen}<span class="cents"> Wochen</span>`, `<span class="s">${schicht.naechte} Nächte in ${schicht.wochen_monate} von ${mm} ${mon}</span>`)}
      </div><div class="mstrip" role="group" aria-label="Nachtschichtwochen je Monat">`;
    schicht.monate.forEach((m, i) => {
      h += `<button type="button" class="mcell${m.alpha > 0.5 ? " dunkel" : ""}" style="--a: ${m.alpha}" data-zmonat="${i}" ${(m.zeilen.length || m.ruf) ? "" : "disabled"}
        aria-label="${MON[i]}: ${m.wochen != null ? deZahl(m.wochen, 0) + " Nachtschichtwochen" : "keine Angaben"}${m.ruf ? ", Rufbereitschaft" : ""}">
        ${m.ruf ? `<span class="wbadge" title="Rufbereitschaft">${wecker(12)}</span>` : ""}<span class="mn">${MON[i]}</span><span class="mv">${fSch(m.wochen)}</span></button>`;
    });
    h += `</div><p class="hint">Die Zahl zeigt die Nachtschichtwochen im Monat, also die Sonntage mit Nachtschicht.${schicht.ruf_monate ? ` Der rote Wecker steht für Rufbereitschaft (${schicht.ruf_monate} ${plural(schicht.ruf_monate, "Monat", "Monate")}).` : ""} Tippe auf einen Monat für die Details.</p>
      <div class="canvas-wrap" style="margin-top:14px"><canvas id="cSchicht"></canvas></div></div></section>`;
  }
  /* --- Gruppe Eigene Kosten --- */
  if (kpi.gastro_summe != null || kpi.fahrrad_summe != null) {
    h += `<section class="group"><h2 class="group-title">Eigene Kosten</h2><div class="stats">`;
    if (kpi.gastro_summe != null) h += kachel("gastro", "Gastronomie", big(kpi.gastro_summe), `<span class="s">Summe im Jahr, Ø ${fEur(kpi.gastro_schnitt)} pro Monat</span>`);
    if (kpi.fahrrad_summe != null) h += kachel("fahrrad", "Fahrrad, Kosten", big(kpi.fahrrad_summe), `<span class="s">Summe im Jahr, Ø ${fEur(kpi.fahrrad_schnitt)} pro Monat</span>`);
    h += `</div></section>`;
  }
  /* --- Diagramme --- */
  h += `<div class="grid2" style="margin-top:28px">
    <section class="plate span2"><h2 class="sec-title">Aufteilung pro Monat</h2><p class="sec-sub">Netto, gesetzliche Abzüge und Sonstiges ergeben zusammen das Brutto.</p><div class="canvas-wrap tall"><canvas id="cAufteilung"></canvas></div></section>
    <section class="plate"><h2 class="sec-title">Netto-Quote</h2><p class="sec-sub">Anteil des Netto am Brutto je Monat. Die Achse ist auf den üblichen Wertebereich zugeschnitten, extreme Ausreißer liegen außerhalb.</p><div class="canvas-wrap"><canvas id="cQuoten"></canvas></div></section>
    <section class="plate"><h2 class="sec-title">Ideenprämien</h2><p class="sec-sub">Summe pro Monat.</p><div class="canvas-wrap"><canvas id="cPraemien"></canvas></div></section>
    <section class="plate span2"><h2 class="sec-title">Zeitkonto, Resturlaub und Sonderurlaub</h2><p class="sec-sub">Zeitkonto in Stunden (links), Urlaubstage (rechts). Gestrichelt: Resturlaub aus dem Vorjahr.</p><div class="canvas-wrap"><canvas id="cZeit"></canvas></div></section></div>`;
  /* --- Tabelle --- */
  h += `<h2 class="sec-title section-gap" style="margin-bottom:12px">Monate im Detail</h2><div class="table-wrap"><table><thead><tr><th>Monat</th><th class="num">Brutto</th><th class="num">Netto</th><th class="num">Abzüge</th><th class="num">Netto-Quote</th><th class="num">Ideen</th><th class="num">Anzahl</th><th>EG</th><th class="num">Leistung</th><th class="num">Zeitkonto</th><th>Status</th><th>Hinweis</th></tr></thead><tbody>`;
  for (const r of c.monatsZeilen) {
    const st = r.status === "OK" ? '<span class="st ok">OK</span>' : r.status === "KEIN BONUS" ? '<span class="st null">Kein Bonus</span>' : '<span class="st fehlt">Datei fehlt</span>';
    h += `<tr class="${r.status === "DATEI FEHLT" ? "fehlt" : ""}"><td>${r.key}${r.ruf ? ` <span title="Rufbereitschaft">${wecker(13)}</span>` : ""}</td><td class="num">${fEur(r.brutto)}</td><td class="num">${fEur(r.netto)}</td><td class="num">${fEur(r.abz)}</td><td class="num">${fPct(r.quote)}</td><td class="num">${fZahl(r.summe)}</td><td class="num">${r.anzahl}</td><td class="sens">${esc(r.eg || "–")}</td><td class="num">${fPct(r.leistung)}</td><td class="num">${fZahl(r.zeitkonto)}</td><td>${st}</td><td>${r.warn ? `<span class="warnchip">${esc(r.warn)}</span>` : ""}</td></tr>`;
  }
  h += `</tbody></table></div><p class="foot">Ideenprogramm über alle geladenen Monate: ${c.gesamtVorschlaege} ${plural(c.gesamtVorschlaege, "Vorschlag", "Vorschläge")}, ${fEur(c.gesamtPraemien)}. Alle Werte stammen aus deinen PDFs und liegen nur in diesem Browserfenster.</p>`;
  return h;
}

function htmlVerlauf(c) {
  const vk = c.vk, sj = c.schichtJahre;
  const karte = (k, v, s, pill) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div>${pill || ""}</div>`;
  let h = `<section class="group"><h2 class="group-title">Entgelt</h2><div class="stats auto">
    ${karte("Netto, Ø letzte 12 Monate", big(vk.netto_12), `Zu den 12 Monaten davor ${delta(vk.netto_delta, true, "%")}`)}
    ${vk.hat_ultimo ? karte("Ultimo, Ø letzte 12 Monate", big(vk.ultimo_12), `Zu den 12 Monaten davor ${delta(vk.ultimo_delta, true, "%")}`) : ""}
    ${karte("Brutto, Ø letzte 12 Monate", big(vk.brutto_12), `${vk.anzahl_monate} Monate mit Daten insgesamt`)}</div>
    <div class="grid2">
    <section class="plate span2"><h2 class="sec-title" id="bnTitel">Brutto und Netto</h2>
      ${vk.hat_ultimo ? `<div class="seg-tabs" role="group" aria-label="Ansicht wählen"><button type="button" data-bn="bn" aria-pressed="true">Brutto und Netto</button><button type="button" data-bn="ur" aria-pressed="false">Ultimo und Rest</button></div>` : ""}
      <p class="sec-sub" id="bnSub">Die gestrichelte Linie zeigt das Netto als Durchschnitt der letzten 12 Monate.</p>
      <div class="canvas-wrap tall" id="bnWrap"><canvas id="hBN"></canvas></div><div class="canvas-wrap tall" id="urWrap" hidden><canvas id="hUR"></canvas></div></section>
    <section class="plate"><h2 class="sec-title">Netto-Quote</h2><p class="sec-sub">Anteil des Netto am Brutto. Die Achse ist auf den üblichen Wertebereich zugeschnitten.</p><div class="canvas-wrap"><canvas id="hQ"></canvas></div></section>
    <section class="plate"><h2 class="sec-title">Ideenprämien</h2><p class="sec-sub">Summe pro Monat.</p><div class="canvas-wrap"><canvas id="hI"></canvas></div></section></div></section>
  <section class="group"><h2 class="group-title">Stufe und Zeitkonto</h2><div class="stats auto">
    ${karte("Zeitkonto aktuell", vk.zk_aktuell != null ? sens(esc(deZahl(vk.zk_aktuell)) + " h") : "–", `Zum Vormonat ${delta(vk.zk_delta_vm, true, "h")}`)}
    ${karte("Entgeltgruppe aktuell", esc(vk.eg || "–"), vk.eg_seit ? `Unverändert seit ${vk.eg_min ? "mindestens " : ""}${esc(vk.eg_seit)}` : "Noch nicht eingelesen", vk.eg_dauer ? `<span class="pill">${esc(vk.eg_dauer)}</span>` : "")}
    ${karte("Leistungsprozente aktuell", fPct(vk.leistung), vk.leistung_seit ? `Unverändert seit ${vk.leistung_min ? "mindestens " : ""}${esc(vk.leistung_seit)}` : "Noch nicht eingelesen", vk.leistung_dauer ? `<span class="pill">${esc(vk.leistung_dauer)}</span>` : "")}</div>
    <div class="grid2">
    <section class="plate span2"><h2 class="sec-title">Leistungsprozente</h2><p class="sec-sub">Stufen der Leistungsbeurteilung. Beim Antippen eines Monats steht die Entgeltgruppe im Tooltip.</p><div class="canvas-wrap"><canvas id="hL"></canvas></div></section>
    <section class="plate span2"><h2 class="sec-title">Zeitkonto</h2><p class="sec-sub">Stand (Linie, links) und Veränderung zum Vormonat (Balken, rechts).</p><div class="canvas-wrap"><canvas id="hZK"></canvas></div></section>
    <section class="plate span2"><h2 class="sec-title">Urlaubstage</h2><p class="sec-sub">Resturlaub laufendes Jahr, Vorjahr (gestrichelt) und Sonderurlaub T-Zug.</p><div class="canvas-wrap"><canvas id="hU"></canvas></div></section></div></section>`;
  if (vk.hat_schicht || sj) {
    h += `<section class="group"><h2 class="group-title">Mehrarbeit</h2>${sj ? `<div class="stats auto">
      ${karte("Nachtschichtwochen insgesamt", `${sj.gesamt.wochen}<span class="cents"> Wochen</span>`, `${sj.gesamt.naechte} Nächte seit ${sj.gesamt.seit}`)}
      ${karte("Mehrarbeit Sonntag insgesamt", `${fZahl(sj.gesamt.mehr_h)}<span class="cents"> Std.</span>`, `Ohne Nachtschicht, seit ${sj.gesamt.seit}`)}</div>` : ""}<div class="grid2">`;
    if (vk.hat_schicht) h += `<section class="plate span2"><h2 class="sec-title">Nachtschichtwochen</h2><p class="sec-sub">Pro Monat, gezählt nach den Sonntagen mit Nachtschicht (Mehrarbeit So. 88 % DNS).</p><div class="canvas-wrap"><canvas id="hNS"></canvas></div></section>
      <section class="plate span2"><h2 class="sec-title">Mehrarbeit Sonntag</h2><p class="sec-sub">Stunden pro Monat an Sonntagen ohne Nachtschicht.</p><div class="canvas-wrap"><canvas id="hMS"></canvas></div></section>`;
    if (sj) h += `<section class="plate span2"><h2 class="sec-title">Je Jahr</h2><p class="sec-sub">Eine Nachtschichtwoche hat ${sj.naechte_pro_woche} Nächte (Sonntag bis Samstag).</p><div class="table-wrap"><table><thead><tr><th>Jahr</th><th class="num">Nachtschichtwochen</th><th class="num">Nächte</th><th class="num">Mehrarbeit Sonntag</th></tr></thead><tbody>
      ${sj.jahre.map(j => `<tr><td>${j.jahr}</td><td class="num">${j.wochen}</td><td class="num">${j.naechte}</td><td class="num">${fZahl(j.mehr_h)} h</td></tr>`).join("")}
      <tr class="summe"><td>Gesamt</td><td class="num">${sj.gesamt.wochen}</td><td class="num">${sj.gesamt.naechte}</td><td class="num">${fZahl(sj.gesamt.mehr_h)} h</td></tr></tbody></table></div></section>`;
    h += `</div></section>`;
  }
  if (vk.hat_posten) h += `<section class="group"><h2 class="group-title">Eigene Kosten</h2><div class="grid2"><section class="plate span2"><h2 class="sec-title">Gastronomie und Fahrrad</h2><p class="sec-sub">Abzüge aus „Sonstige Be- und Abzüge“ und Fahrradkosten pro Monat.</p><div class="canvas-wrap"><canvas id="hGF"></canvas></div></section></div></section>`;
  return h + `<p class="foot">Monate ohne Abrechnung werden in den Linien überbrückt.</p>`;
}

function htmlVergleich(c) {
  const v = c.v, jahre = c.jahreAsc;
  let h = `<h1 class="page-title">Vergleich</h1><p class="lede">Jahre und einzelne Monate nebeneinander stellen.</p>
  <form id="vgForm" class="plate filter"><div><p class="grp-title">Jahre</p><div class="togs">${jahre.map(j => `<label class="tog"><input type="checkbox" name="jahre" value="${j}" ${v.sel.includes(j) ? "checked" : ""}><span>${j}</span></label>`).join("")}</div></div>
  <div><p class="grp-title">Monate <span class="faint" style="font-weight:400">(nichts gewählt zeigt alle)</span></p><div class="togs">${MON.map((n, i) => `<label class="tog"><input type="checkbox" name="monate" value="${i + 1}" ${v.monate_sel.includes(i + 1) ? "checked" : ""}><span>${n}</span></label>`).join("")}</div></div>
  <div class="row-opts"><label>Kennzahl <select name="kennzahl" style="margin-left:8px">${METRIK_GRUPPEN.map(([g, keys]) => `<optgroup label="${g}">${keys.map(k => `<option value="${k}" ${k === v.metrik ? "selected" : ""}>${METRIKEN[k][0]}</option>`).join("")}</optgroup>`).join("")}</select></label>
  <label class="check"><input type="checkbox" name="gleich" value="1" ${v.gleich ? "checked" : ""}> Nur Monate, die in allen gewählten Jahren vorhanden sind</label></div>
  <button class="btn" type="submit">Vergleichen</button></form>`;
  if (!v.sel.length) return h + '<div class="plate empty">Bitte mindestens ein Jahr auswählen.</div>';
  if (!v.monate.length) return h + '<div class="plate empty">Für diese Auswahl gibt es keine gemeinsamen Monate mit Daten. Wähle andere Monate oder schalte die Option „Nur Monate, die in allen gewählten Jahren vorhanden sind“ aus.</div>';
  const fmtW = w => v.typ === "pct" ? fPct(w) : v.typ === "h" ? (w == null ? "–" : fZahl(w) + " h") : v.typ === "n" ? fSch(w) : fEur(w);
  h += `<p class="hint" style="margin:0 0 14px">Verglichen werden ${v.monate_labels.join(", ")} in ${v.sel.join(", ")}.</p>
  <h2 class="sec-title" style="margin-bottom:12px">Je Jahr über die verglichenen Monate</h2><div class="table-wrap"><table><thead><tr><th>Jahr</th><th class="num">Monate</th><th class="num">Brutto</th><th class="num">Netto</th><th class="num">Abzüge</th><th class="num">Sonstige</th><th class="num">Netto-Quote</th><th class="num">Ideen</th><th class="num">Anzahl</th><th class="num">Δ Netto</th><th class="num">Δ Ideen</th></tr></thead><tbody>

  <div class="grid2"><section class="plate span2"><h2 class="sec-title">${v.label} pro Monat</h2><p class="sec-sub">Eine Farbe je Jahr.</p><div class="canvas-wrap tall"><canvas id="cVergleich"></canvas></div></section>
  ${v.kumuliert ? `<section class="plate span2"><h2 class="sec-title">${v.label} kumuliert</h2><p class="sec-sub">Aufsummiert über die verglichenen Monate.</p><div class="canvas-wrap"><canvas id="cKumuliert"></canvas></div></section>` : ""}</div>
  <h2 class="sec-title section-gap" style="margin-bottom:12px">${v.label} nach Monat und Jahr</h2><div class="table-wrap"><table><thead><tr><th>Monat</th>${v.serien.map(s => `<th class="num">${s.jahr}</th>`).join("")}${v.sel.length > 1 ? `<th class="num">Δ ${v.sel[0]} bis ${v.sel[v.sel.length - 1]}</th>` : ""}</tr></thead><tbody>
  ${v.matrix.map(r => `<tr><td>${r.monat}</td>${r.werte.map(w => `<td class="num">${fmtW(w)}</td>`).join("")}${v.sel.length > 1 ? `<td class="num">${delta(r.delta, v.hoch_ist_gut, v.typ === "pct" ? "PP" : "%")}</td>` : ""}</tr>`).join("")}</tbody></table></div>${v.typ === "pct" ? '<p class="hint">PP steht für Prozentpunkte.</p>' : ""}`;
  return h;
}

function htmlDaten(c) {

  if (c.demo) {
    h += `<div class="plate"><button type="button" class="btn" id="loeschBtn">Demo beenden</button>
      <p class="hint" style="margin-top:12px">Bei Demodaten ist das Speichern abgeschaltet. Wähle PDFs oder lade eine Sicherung, um deine eigenen Daten zu sehen.</p>
      <label class="btn" for="pdfInput" style="display:inline-block;cursor:pointer;margin-top:4px">PDF-Abrechnungen auswählen</label>

    h += `<div class="plate"><label class="btn" for="pdfInput" style="display:inline-block;cursor:pointer">Weitere PDFs hinzufügen</label>
      <button type="button" class="btn" id="loeschBtn" style="margin-left:8px;background:transparent;color:var(--ink);border:1px solid var(--line)">Alle Daten löschen</button>
      <p class="hint" style="margin-top:12px">${c.merken ? "Die Daten sind auf diesem Gerät gespeichert und bleiben nach dem Neuladen erhalten." : "Die Daten liegen nur im Arbeitsspeicher dieses Fensters. Beim Schließen oder Neuladen der Seite sind sie weg."}</p></div>
    <h2 class="sec-title section-gap" style="margin-bottom:8px">Merken und Sichern</h2>
    <div class="plate">
      ${c.gesperrt ? `<div class="ruf-banner" style="margin:0 0 14px"><div><b>Gemerkte Daten sind gesperrt</b><span>Sie sind mit einem Passwort geschützt. Neue Daten werden erst nach dem Entsperren gespeichert.</span><button type="button" class="btn" id="entsperrenBtn" style="margin-top:10px">Entsperren</button></div></div>` : ""}
      <label class="check" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="merkenChk" ${c.merken ? "checked" : ""} ${c.speicherOk ? "" : "disabled"} style="margin-top:4px">
      <span><b>Auf diesem Gerät merken</b><br><span class="hint">Speichert die ausgelesenen Werte (nicht die PDFs) im Browser dieses Geräts. Nichts wird hochgeladen. Auf fremden oder geteilten Geräten besser ausgeschaltet lassen. ${c.speicherOk ? "" : "Hier ist Speichern nicht möglich, zum Beispiel im privaten Modus."}</span></span></label>
      <label class="check" style="display:flex;gap:10px;align-items:flex-start;margin-top:12px"><input type="checkbox" id="schutzChk" ${c.schutz ? "checked" : ""} ${(c.merken && c.krypto && !c.gesperrt && monate.length) ? "" : "disabled"} style="margin-top:4px">
      <span><b>Gemerkte Daten mit Passwort schützen</b><br><span class="hint">${c.krypto ? `Verschlüsselt den Speicher im Browser (AES-256). Das Passwort wird bei jedem Öffnen der App abgefragt, es gibt keine Wiederherstellung. Zuerst „Auf diesem Gerät merken“ einschalten und Daten laden.` : "Verschlüsselung ist in diesem Browser nicht verfügbar (sie braucht eine https-Adresse)."}</span></span></label>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <label class="check" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" id="sichernPw" ${c.krypto ? "checked" : "disabled"} style="margin-top:4px">
      <span><b>Sicherungsdatei mit Passwort verschlüsseln</b> (empfohlen)<br><span class="hint">Eine unverschlüsselte Datei kann jeder lesen, der sie bekommt, zum Beispiel über Cloud oder Messenger.</span></span></label>
      <div style="margin-top:14px"><button type="button" class="btn" id="sichernBtn" ${monate.length ? "" : "disabled"}>Als Datei sichern</button>
      <label class="btn" for="sicherungInput" style="${aus};margin-left:8px">Datei laden</label></div>
      <p class="hint" style="margin-top:12px">Ohne Passwort ist die Datei nicht zu öffnen. Wähle mindestens 10 Zeichen und notiere es dir sicher. Safari auf dem iPhone kann gemerkte Daten nach etwa sieben Tagen ohne Besuch löschen, auch das Löschen des Browserverlaufs entfernt sie.</p></div>`;
  }
  h += `${luecken.length ? `<h2 class="sec-title section-gap" style="margin-bottom:8px">Fehlende Monate</h2><div class="plate"><p class="hint" style="margin:0">Zwischen dem ersten und letzten Monat fehlen: ${luecken.join(", ")}.</p></div>` : ""}
  <h2 class="sec-title section-gap" style="margin-bottom:8px">Hinweise beim Einlesen</h2>
  <div class="plate">${c.hinweise.length ? `<ul class="loglist">${c.hinweise.map(t => `<li><span>${esc(t)}</span></li>`).join("")}</ul>` : '<p class="hint" style="margin:0">Keine Auffälligkeiten.</p>'}</div>
  <details class="plate" style="margin-top:12px"><summary class="hint" style="cursor:pointer">Systemprüfung</summary><pre style="white-space:pre-wrap;word-break:break-word;font-size:.78rem;margin:10px 0 0">${esc(systemInfo())}</pre></details>`;
  return h;
}

const WECKER_SVG = wecker(18);
function initJahr(D, M, S, WECKER) {


        new Chart(ctx('cAufteilung'), {
            type: 'bar',
            data: {labels: D.labels, datasets: [
                {label: 'Netto', data: D.netto, backgroundColor: C.netto, borderRadius: 5},

            ]},
            options: {

                    footer: items => 'Brutto: ' + eur(D.brutto[items[0].dataIndex])
                }}}
            }
        });

        new Chart(ctx('cQuoten'), {
